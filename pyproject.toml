[project]
name = "lmz-tile-search"
version = "0.1.0"
description = "TileSet Search Tool"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "notebook>=7.5.2",
    "opencv-contrib-python>=4.12.0.88",
    "openpyxl>=3.1.5",
    "scipy>=1.17.0",
    "tqdm>=4.67.1",
    "flake8-pyproject>=1.2.3",
]

[tool.uv]
package = false

[tool.flake8]
max-line-length = 88
extend-ignore = "E203"
